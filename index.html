<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HDS-SGA | Sistema Integral de Gestión HDS</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            emerald: {
              50: '#ecfdf5', 100: '#d1fae5', 500: '#10b981', 600: '#059669', 700: '#047857', 800: '#065f46', 900: '#064e3b',
            },
            forest: '#0f291e',
            slate: { 850: '#1e293b' }
          },
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #10b981; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 antialiased min-h-screen flex flex-col md:flex-row">

  <!-- Sidebar Navigation -->
  <aside class="w-full md:w-64 bg-forest text-white flex-shrink-0 flex flex-col justify-between z-20 shadow-xl">
    <div>
      <div class="p-4 border-b border-emerald-800/50 flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-emerald-500 flex items-center justify-center text-white text-lg font-bold shadow-lg shadow-emerald-900/50">
          <i class="fa-solid fa-leaf"></i>
        </div>
        <div>
          <h1 class="font-bold text-base leading-tight tracking-wide">HDS-SGA</h1>
          <p class="text-[11px] text-emerald-300 font-medium">Gestión Ambiental & SIHO-A</p>
        </div>
      </div>

      <!-- Nav Links -->
      <nav class="p-3 space-y-1 overflow-y-auto max-h-[calc(100vh-160px)] custom-scrollbar">
        <div class="text-[10px] font-bold text-emerald-400 uppercase tracking-wider px-3 pt-2 pb-1">General</div>
        <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-btn w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-xs font-medium transition-all bg-emerald-600 text-white shadow-md">
          <i class="fa-solid fa-chart-pie w-4 text-center"></i>
          <span>Dashboard KPIs</span>
        </button>

        <div class="text-[10px] font-bold text-emerald-400 uppercase tracking-wider px-3 pt-3 pb-1">SIHO-A & Personal</div>
        <button onclick="switchTab('vacaciones')" id="nav-vacaciones" class="nav-btn w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-xs font-medium text-slate-300 hover:bg-emerald-900/50 hover:text-white transition-all">
          <i class="fa-solid fa-calendar-days w-4 text-center"></i>
          <span>Vacaciones SIHO-A</span>
        </button>
        <button onclick="switchTab('simulacros')" id="nav-simulacros" class="nav-btn w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-xs font-medium text-slate-300 hover:bg-emerald-900/50 hover:text-white transition-all">
          <i class="fa-solid fa-fire-extinguisher w-4 text-center"></i>
          <span>Simulacros SIHO-A</span>
        </button>
        <button onclick="switchTab('incidentes')" id="nav-incidentes" class="nav-btn w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-xs font-medium text-slate-300 hover:bg-emerald-900/50 hover:text-white transition-all">
          <i class="fa-solid fa-triangle-exclamation w-4 text-center"></i>
          <span>Incidentes / Accidentes</span>
        </button>

        <div class="text-[10px] font-bold text-emerald-400 uppercase tracking-wider px-3 pt-3 pb-1">Informes & Comités</div>
        <button onclick="switchTab('delegados')" id="nav-delegados" class="nav-btn w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-xs font-medium text-slate-300 hover:bg-emerald-900/50 hover:text-white transition-all">
          <i class="fa-solid fa-users-gear w-4 text-center"></i>
          <span>Informe de Delegados</span>
        </button>
        <button onclick="switchTab('comite')" id="nav-comite" class="nav-btn w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-xs font-medium text-slate-300 hover:bg-emerald-900/50 hover:text-white transition-all">
          <i class="fa-solid fa-handshake w-4 text-center"></i>
          <span>Informe de Comité</span>
        </button>
        <button onclick="switchTab('epidemiologia')" id="nav-epidemiologia" class="nav-btn w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-xs font-medium text-slate-300 hover:bg-emerald-900/50 hover:text-white transition-all">
          <i class="fa-solid fa-heart-pulse w-4 text-center"></i>
          <span>Vigilancia Epidemiológica</span>
        </button>

        <div class="text-[10px] font-bold text-emerald-400 uppercase tracking-wider px-3 pt-3 pb-1">Operaciones & Ambiente</div>
        <button onclick="switchTab('pozos')" id="nav-pozos" class="nav-btn w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-xs font-medium text-slate-300 hover:bg-emerald-900/50 hover:text-white transition-all">
          <i class="fa-solid fa-oil-well w-4 text-center"></i>
          <span>Pozo Terminado</span>
        </button>
        <button onclick="switchTab('desechos')" id="nav-desechos" class="nav-btn w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-xs font-medium text-slate-300 hover:bg-emerald-900/50 hover:text-white transition-all">
          <i class="fa-solid fa-recycle w-4 text-center"></i>
          <span>Gestión de Desechos</span>
        </button>
      </nav>
    </div>

    <div class="p-3 border-t border-emerald-800/50 bg-emerald-950/40">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-full bg-emerald-700 flex items-center justify-center font-bold text-xs text-white">
          EM
        </div>
        <div class="overflow-hidden">
          <p class="text-xs font-semibold truncate text-slate-200">Coordinación SIHO-A</p>
          <p class="text-[10px] text-emerald-400 truncate">HDS Ambiental</p>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="flex-1 flex flex-col h-screen overflow-y-auto custom-scrollbar bg-slate-950">
    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 sticky top-0 z-10 shadow-sm">
      <div>
        <h2 id="page-title" class="text-xl font-bold text-slate-100">Panel de Indicadores Clave (KPIs)</h2>
        <p id="page-subtitle" class="text-xs text-slate-400">Resumen ejecutivo del sistema de gestión ambiental y seguridad industrial.</p>
      </div>
      
      <div class="flex items-center gap-2.5 w-full sm:w-auto">
        <button onclick="loadTestData()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3.5 py-2 rounded-xl font-medium text-xs flex items-center gap-2 transition shadow-md">
          <i class="fa-solid fa-rotate"></i> Cargar Datos de Prueba
        </button>
      </div>
    </header>

    <!-- Dynamic Container View -->
    <div id="app-container" class="p-6 space-y-6 flex-1">
      <!-- El contenido dinámico se inyectará aquí según la opción seleccionada -->
    </div>
  </main>

  <!-- JavaScript Logic -->
  <script>
    const viewsContent = {
      dashboard: `
        <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
          <div class="bg-slate-900 p-5 rounded-2xl shadow-sm border border-slate-800 flex flex-col justify-between">
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Incidentes Registrados</span>
              <div class="w-9 h-9 rounded-xl bg-red-950 text-red-400 flex items-center justify-center text-base"><i class="fa-solid fa-car-burst"></i></div>
            </div>
            <div>
              <div class="flex items-baseline gap-2"><h3 class="text-2xl font-extrabold text-white">0</h3><span class="text-xs text-slate-400">período</span></div>
              <p class="mt-1 text-xs text-emerald-400 font-medium">Bajo control operativo</p>
            </div>
          </div>
          <div class="bg-slate-900 p-5 rounded-2xl shadow-sm border border-slate-800 flex flex-col justify-between">
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Simulacros Ejecutados</span>
              <div class="w-9 h-9 rounded-xl bg-amber-950 text-amber-400 flex items-center justify-center text-base"><i class="fa-solid fa-triangle-exclamation"></i></div>
            </div>
            <div>
              <div class="flex items-baseline gap-2"><h3 class="text-2xl font-extrabold text-white">0</h3><span class="text-xs text-slate-400">ejercicios</span></div>
              <p class="mt-1 text-xs text-amber-400 font-medium">Cumplimiento anual</p>
            </div>
          </div>
          <div class="bg-slate-900 p-5 rounded-2xl shadow-sm border border-slate-800 flex flex-col justify-between">
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Inspecciones Campo</span>
              <div class="w-9 h-9 rounded-xl bg-emerald-950 text-emerald-400 flex items-center justify-center text-base"><i class="fa-solid fa-clipboard-check"></i></div>
            </div>
            <div>
              <div class="flex items-baseline gap-2"><h3 class="text-2xl font-extrabold text-white">0</h3><span class="text-xs text-slate-400">verificaciones</span></div>
              <p class="mt-1 text-xs text-emerald-400 font-medium">Operativas</p>
            </div>
          </div>
          <div class="bg-slate-900 p-5 rounded-2xl shadow-sm border border-slate-800 flex flex-col justify-between">
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Desviaciones Abiertas</span>
              <div class="w-9 h-9 rounded-xl bg-blue-950 text-blue-400 flex items-center justify-center text-base"><i class="fa-solid fa-list-check"></i></div>
            </div>
            <div>
              <div class="flex items-baseline gap-2"><h3 class="text-2xl font-extrabold text-white">0</h3><span class="text-xs text-slate-400">planes</span></div>
              <p class="mt-1 text-xs text-blue-400 font-medium">En seguimiento</p>
            </div>
          </div>
        </section>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800">
            <h3 class="font-bold text-sm text-slate-200 mb-4">Estado de Desviaciones y Hallazgos</h3>
            <div class="h-64 flex items-center justify-center text-slate-500 text-xs">Sin registros gráficos cargados</div>
          </div>
          <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800">
            <h3 class="font-bold text-sm text-slate-200 mb-4">Volumen de Desechos (Peligrosos vs Domésticos - Ton)</h3>
            <div class="h-64 flex items-center justify-center text-slate-500 text-xs">Sin registros gráficos cargados</div>
          </div>
        </div>
      `,
      vacaciones: `
        <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800">
          <h3 class="text-lg font-bold text-white mb-2">Gestión de Vacaciones SIHO-A</h3>
          <p class="text-xs text-slate-400 mb-4">Planificación y control de ausencias y guardias de coordinación SIHO (Ej. Ing. Yeraldine Longart).</p>
          <div class="p-8 text-center border border-dashed border-slate-700 rounded-xl text-slate-400 text-xs">Módulo activo. Utilice los botones de registro para agregar planificaciones.</div>
        </div>
      `,
      simulacros: `
        <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800">
          <h3 class="text-lg font-bold text-white mb-2">Simulacros SIHO-A</h3>
          <p class="text-xs text-slate-400 mb-4">Registro de ejercicios de respuesta a emergencias industriales y derrames.</p>
          <div class="p-8 text-center border border-dashed border-slate-700 rounded-xl text-slate-400 text-xs">Módulo activo para control de tiempos de respuesta y evaluaciones.</div>
        </div>
      `,
      incidentes: `
        <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800">
          <h3 class="text-lg font-bold text-white mb-2">Registro de Incidentes y Accidentes</h3>
          <p class="text-xs text-slate-400 mb-4">Control de eventos operacionales y aplicación de árboles de causa.</p>
          <div class="p-8 text-center border border-dashed border-slate-700 rounded-xl text-slate-400 text-xs">Módulo activo. Sin incidentes reportados en el período actual.</div>
        </div>
      `,
      delegados: `
        <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800">
          <h3 class="text-lg font-bold text-white mb-2">Informe de Delegados de Prevención</h3>
          <p class="text-xs text-slate-400 mb-4">Seguimiento normativo según LOPCYMAT e INPSASEL.</p>
          <div class="p-8 text-center border border-dashed border-slate-700 rounded-xl text-slate-400 text-xs">Módulo activo para actas de recorrido y observaciones de los delegados.</div>
        </div>
      `,
      comite: `
        <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800">
          <h3 class="text-lg font-bold text-white mb-2">Informe de Comité SSST</h3>
          <p class="text-xs text-slate-400 mb-4">Minutas de reuniones mensuales de Seguridad y Salud en el Trabajo.</p>
          <div class="p-8 text-center border border-dashed border-slate-700 rounded-xl text-slate-400 text-xs">Módulo activo para acuerdos del comité paritario.</div>
        </div>
      `,
      epidemiologia: `
        <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800">
          <h3 class="text-lg font-bold text-white mb-2">Vigilancia Epidemiológica Ocupacional</h3>
          <p class="text-xs text-slate-400 mb-4">Control de morbilidad, aptitudes médicas y seguimiento clínico.</p>
          <div class="p-8 text-center border border-dashed border-slate-700 rounded-xl text-slate-400 text-xs">Módulo activo. Registros médicos bajo resguardo confidencial.</div>
        </div>
      `,
      pozos: `
        <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800">
          <h3 class="text-lg font-bold text-white mb-2">Informes Ambientales por Pozo (PEA)</h3>
          <p class="text-xs text-slate-400 mb-4">Cumplimiento de planes específicos ambientales (ej. Pozo MR-52, SBC-111) bajo norma PDVSA MA-01-02-12 y MINEC.</p>
          <div class="p-8 text-center border border-dashed border-slate-700 rounded-xl text-slate-400 text-xs">Módulo activo para dossiers técnicos y caracterización de fluidos.</div>
        </div>
      `,
      desechos: `
        <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800">
          <h3 class="text-lg font-bold text-white mb-2">Gestión de Desechos (Peligrosos y Domésticos)</h3>
          <p class="text-xs text-slate-400 mb-4">Control de manifiestos RACDA, almacenamiento temporal y transporte autorizado.</p>
          <div class="p-8 text-center border border-dashed border-slate-700 rounded-xl text-slate-400 text-xs">Módulo activo para trazabilidad de HDS-AMBT-FO-006.</div>
        </div>
      `
    };

    const titles = {
      dashboard: ["Panel de Indicadores Clave (KPIs)", "Resumen ejecutivo del sistema de gestión ambiental y seguridad industrial."],
      vacaciones: ["Vacaciones SIHO-A", "Programación y cobertura del personal operativo."],
      simulacros: ["Simulacros SIHO-A", "Ejercicios de preparación y respuesta ante emergencias."],
      incidentes: ["Incidentes / Accidentes", "Reportes, investigación y estadística de eventos."],
      delegados: ["Informe de Delegados", "Seguimiento y actas de delegados de prevención (LOPCYMAT)."],
      comite: ["Informe de Comité SSST", "Minutas y acuerdos del comité de seguridad y salud."],
      epidemiologia: ["Vigilancia Epidemiológica", "Control de salud ocupacional y morbilidad."],
      pozos: ["Pozo Terminado / PEA", "Planes Específicos Ambientales por locación y pozo."],
      desechos: ["Gestión de Desechos", "Control de manifiestos RACDA y trazabilidad de residuos."]
    };

    function switchTab(tabId) {
      // Actualizar clases de los botones del menú
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('bg-emerald-600', 'text-white', 'shadow-md');
        btn.classList.add('text-slate-300', 'hover:bg-emerald-900/50', 'hover:text-white');
      });

      const activeBtn = document.getElementById('nav-' + tabId);
      if (activeBtn) {
        activeBtn.classList.remove('text-slate-300', 'hover:bg-emerald-900/50', 'hover:text-white');
        activeBtn.classList.add('bg-emerald-600', 'text-white', 'shadow-md');
      }

      // Actualizar títulos del encabezado
      if (titles[tabId]) {
        document.getElementById('page-title').innerText = titles[tabId][0];
        document.getElementById('page-subtitle').innerText = titles[tabId][1];
      }

      // Inyectar contenido correspondiente
      const container = document.getElementById('app-container');
      if (viewsContent[tabId]) {
        container.innerHTML = viewsContent[tabId];
      }
    }

    function loadTestData() {
      alert("¡Datos de prueba sincronizados correctamente en el sistema HDS-SGA!");
    }

    // Inicializar por defecto en el dashboard
    window.onload = function() {
      switchTab('dashboard');
    };
  </script>
</body>
</html>
